{% extends "employe/base.html" %}

{% block title %}Supprimer {{ emp.nom }}{% endblock %}

{% block content %}
<div class="p-6 bg-base-100 rounded-lg space-y-4">
    <h1 class="text-xl font-bold">Supprimer un employé</h1>
    <p>Voulez-vous vraiment supprimer <strong>{{ emp.nom }}</strong> ? Cette action est définitive.</p>

    <form method="post" action="{% url 'supprimer_employe' emp.id %}" class="flex gap-2">
        {% csrf_token %}
        <button type="submit" class="btn btn-error btn-sm">Oui, supprimer</button>
        <a href="{% url 'liste_employes' %}" class="btn btn-ghost btn-sm">Annuler</a>
    </form>
</div>
{% endblock %}
