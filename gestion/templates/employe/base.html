<!DOCTYPE html>
<html lang="fr" data-theme="forest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Application Django de gestion des employés (CRUD) — projet d'Emile Dufoulon.">
    <title>{% block title %}Employés{% endblock %} — Gestion des employés</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-base-300">
    <header class="navbar bg-base-200 px-4 sm:px-8">
        <div class="flex-1">
            <a href="{% url 'liste_employes' %}" class="text-lg font-bold">Gestion des employés</a>
        </div>
        {% if user.is_authenticated %}
        <div class="flex items-center gap-3">
            <span class="text-sm opacity-80 hidden sm:inline">{{ user.username }}</span>
            <form method="post" action="{% url 'deconnexion' %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-ghost btn-sm">Se déconnecter</button>
            </form>
        </div>
        {% endif %}
    </header>

    <main class="flex justify-center px-4 py-10 sm:py-16">
        <div class="w-full max-w-3xl bg-base-200 rounded-xl p-4 sm:p-6">
            {% if messages %}
            <div class="space-y-2 mb-4" role="status">
                {% for message in messages %}
                <div class="alert alert-success alert-soft">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <footer class="text-center text-sm opacity-70 pb-8">
        Projet d’Emile Dufoulon — données fictives ·
        <a class="link" href="https://github.com/EmileSch19/django-gestion-employes">Code source</a>
    </footer>
</body>
</html>
